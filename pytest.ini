[pytest]
# `srcs/billing-app/tests/test_validation.py` and
# `srcs/inventory-app/tests/test_validation.py` share a basename and neither
# directory is a package, so pytest's default prepend import mode rejects the
# second one with "import file mismatch". importlib mode keys each module by its
# full path instead, which is what lets both suites coexist in one run.
addopts = --import-mode=importlib
testpaths = srcs scripts
python_files = test_*.py